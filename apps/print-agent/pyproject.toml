[project]
name = "izao-agent"
version = "1.0.0"
description = "Agente local de impresión de guías de Izao Perfumería (Windows)"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6",
  "tenacity>=8.2",
  "keyring>=25",
  "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
panel = ["playwright>=1.45"]
dev = ["pytest>=8", "pytest-timeout>=2.3", "pyinstaller>=6.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 60
