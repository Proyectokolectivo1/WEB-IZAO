# Integración continua: calidad (lint, tipos, pruebas) y e2e con Playwright.
# Sin secretos: las pruebas usan un Supabase falso local (apps/web/tests/support/supabase-falso.mjs).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @izao/web exec playwright install --with-deps chromium
      - run: pnpm --filter @izao/web build
      - run: pnpm --filter @izao/web test:e2e
        env:
          CI: '1'
      - name: Subir resultados de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-e2e
          path: apps/web/tests/.resultados/
          if-no-files-found: ignore
          retention-days: 14

  # Agente de impresión (Python): fuera de pnpm/turbo. Servidor falso y SumatraPDF falso:
  # no imprime nada ni usa el token real. Solo corre si cambia el agente o el workflow.
  agente-impresion:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/print-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            apps/print-agent/requirements.txt
            apps/print-agent/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          IZAO_AGENT_TOKEN: token-de-prueba-ci
