# Izao Perfumería — Docker Compose (local y VPS).
#   Local:  cd infra && docker compose up --build
#   Con Nginx local (puerto 80):  docker compose --profile nginx up --build
# Variables en infra/.env (copiar de .env.example). Sin .env también arranca en local.
name: izao

x-env-opcional: &env-opcional
  env_file:
    - path: .env
      required: false

services:
  redis:
    image: redis:7-alpine
    command: >
      redis-server --appendonly yes --maxmemory 400mb --maxmemory-policy noeviction
    restart: unless-stopped
    volumes:
      - ${IZAO_DATA_DIR:-./data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 600m

  web:
    <<: *env-opcional
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    image: izao-web:${IZAO_TAG:-local}
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      MEDIA_ROOT: /srv/izao/media
    depends_on:
      redis:
        condition: service_healthy
    # Rango para permitir 1-2 réplicas; solo escucha en loopback (Nginx hace de entrada).
    ports:
      - "127.0.0.1:${WEB_PORT_RANGE:-3000-3001}:3000"
    volumes:
      - ${IZAO_MEDIA_DIR:-${IZAO_DATA_DIR:-./data}/media}:/srv/izao/media
      - ${IZAO_DATA_DIR:-./data}/geo:/srv/izao/geo:ro
    deploy:
      replicas: ${WEB_REPLICAS:-1}
      resources:
        limits:
          memory: 1536m

  worker:
    <<: *env-opcional
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    image: izao-worker:${IZAO_TAG:-local}
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      MEDIA_ROOT: /srv/izao/media
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ${IZAO_MEDIA_DIR:-${IZAO_DATA_DIR:-./data}/media}:/srv/izao/media
    deploy:
      resources:
        limits:
          memory: 1024m

  uptime:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${UPTIME_PORT:-3011}:3001"
    volumes:
      - ${IZAO_DATA_DIR:-./data}/uptime:/app/data
    deploy:
      resources:
        limits:
          memory: 384m

  # Solo si el VPS no tiene ya un proxy inverso (ver docs/RUNBOOK.md). Local: HTTP en :8080.
  nginx:
    profiles: ["nginx"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx:/srv/izao/nginx:ro
      - ./nginx/env/container/izao-http.conf:/etc/nginx/conf.d/00-izao-http.conf:ro
      - ./nginx/izao.local.conf:/etc/nginx/conf.d/default.conf:ro
      - ${IZAO_MEDIA_DIR:-${IZAO_DATA_DIR:-./data}/media}:/srv/izao/media:ro
    deploy:
      resources:
        limits:
          memory: 128m
