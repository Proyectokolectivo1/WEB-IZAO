# Zonas de rate limit (contexto http). 30 r/s por IP en /api/; estricto en /api/chat y formularios.
limit_req_zone $binary_remote_addr zone=izao_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=izao_chat:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=izao_forms:10m rate=5r/m;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=izao_conn:10m;

upstream izao_web {
    # Contenedor: servicio "web" de Compose (varias réplicas se resuelven por DNS).
    # Proxy del host: cambiar por 127.0.0.1:3000 y 127.0.0.1:3001 (ver docs/RUNBOOK.md).
    server web:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}
