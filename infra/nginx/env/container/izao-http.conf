# Nginx en contenedor (perfil "nginx" de Compose): directivas de contexto http.
# Se monta como /etc/nginx/conf.d/00-izao-http.conf.
server_tokens off;
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

include /srv/izao/nginx/izao-zones.conf;

upstream izao_web {
    # Servicio "web" de Compose (las réplicas se resuelven por DNS).
    server web:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}
