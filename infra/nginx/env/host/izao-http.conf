# Nginx del HOST del VPS (ya existente, compartido con otros proyectos): solo lo propio de Izao.
# Se enlaza como /etc/nginx/conf.d/izao-http.conf (contexto http). No toca gzip ni server_tokens
# del nginx.conf del host. La app publica 127.0.0.1:3000 y 127.0.0.1:3001 (réplicas de web).
include /srv/izao/nginx/izao-zones.conf;

upstream izao_web {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
    keepalive 32;
}
