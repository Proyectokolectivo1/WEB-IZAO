# Zonas de rate limit y mapa de HSTS (contexto http; se incluye desde env/*/izao-http.conf). 30 r/s por IP en /api/; estricto en /api/chat y formularios.
limit_req_zone $binary_remote_addr zone=izao_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=izao_chat:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=izao_forms:10m rate=5r/m;
# Autenticación del panel: solo las peticiones POST cuentan (clave vacía = sin límite).
map $request_method $izao_admin_auth_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $izao_admin_auth_key zone=izao_admin_login:10m rate=5r/m;
limit_req_zone $izao_admin_auth_key zone=izao_admin_mfa:10m rate=5r/m;

# Server Actions de Next 15: un POST con la cabecera Next-Action se ejecuta en cualquier ruta, así
# que el límite por ruta de /admin/login se esquivaría con POST a "/". Todo POST con Next-Action
# se limita por IP sin importar la ruta (1 por segundo, ráfaga de 30: holgado para la tienda, pero
# frena la fuerza bruta). El límite estricto anti-fuerza-bruta del login debe reforzarse también
# en la aplicación (bloqueo por intentos), porque Nginx no distingue qué acción se invoca.
map "$request_method:$http_next_action" $izao_next_action_key {
    default       "";
    "~^POST:.+$"  $binary_remote_addr;
}
limit_req_zone $izao_next_action_key zone=izao_next_action:10m rate=60r/m;

# HSTS solo cuando la conexión es HTTPS (con valor vacío, add_header no emite la cabecera).
# includeSubDomains queda desactivado: web.izaoperfumeria.com (sitio anterior, §4.2) debe tener
# HTTPS válido antes de activarlo; entonces cambiar a "max-age=15768000; includeSubDomains"; sin preload hasta decidirlo.
map $scheme $izao_hsts {
    https   "max-age=15768000";
    default "";
}

# CSP por ruta. /admin/** permite img-src data: (el QR del MFA llega como SVG en un data: URL) y font-src data:.
# La tienda NO usa data: (decidido: no usa blurDataURL ni imágenes/fuentes incrustadas; las fuentes se sirven
# desde el mismo origen). Si se agrega un placeholder borroso incrustado, hay que reabrir esta decisión.
# Turnstile (formularios públicos): challenges.cloudflare.com en script-src, frame-src y connect-src.
map $uri $izao_csp {
    # /media/**: sin scripts ni nada activo aunque alguien llegue a subir un archivo raro.
    ~^/media/ "default-src 'none'; sandbox";
    default "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' blob: https:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://challenges.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com https://checkout.wompi.co; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'";
    ~^/admin(/|$) "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://challenges.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com https://checkout.wompi.co; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'";
}

# Caché de estáticos de Next (/_next/static/, nombres con hash). El directorio lo crea Nginx al arrancar
# (el padre /var/cache/nginx existe en Ubuntu y en la imagen oficial).
proxy_cache_path /var/cache/nginx/izao_static levels=1:2 keys_zone=izao_static:10m max_size=300m inactive=30d use_temp_path=off;
