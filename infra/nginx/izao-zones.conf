# Zonas de rate limit y mapa de HSTS (contexto http; se incluye desde env/*/izao-http.conf). 30 r/s por IP en /api/; estricto en /api/chat y formularios.
limit_req_zone $binary_remote_addr zone=izao_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=izao_chat:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=izao_forms:10m rate=5r/m;
# HSTS solo cuando la conexión es HTTPS (con valor vacío, add_header no emite la cabecera).
# includeSubDomains queda desactivado: web.izaoperfumeria.com (sitio anterior, §4.2) debe tener
# HTTPS válido antes de activarlo; entonces cambiar a "max-age=31536000; includeSubDomains".
map $scheme $izao_hsts {
    https   "max-age=31536000";
    default "";
}
