# Locations comunes (producción y local). Se incluye dentro de un bloque server.
limit_req_status 429;
client_max_body_size 35m;

location /media/ {
    alias /srv/izao/media/;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    include /srv/izao/nginx/izao-security-headers.conf;
    access_log off;
    try_files $uri =404;
}

location = /api/health {
    proxy_pass http://izao_web;
    include /srv/izao/nginx/izao-proxy.conf;
    include /srv/izao/nginx/izao-security-headers.conf;
    access_log off;
}

# Login y MFA del panel (zonas separadas): 5 POST/min por IP en cada una con ráfaga de 3 (429 al exceder).
location = /admin/login {
    limit_req zone=izao_admin_login burst=3 nodelay;
    limit_req zone=izao_next_action burst=30 nodelay;
    proxy_pass http://izao_web;
    include /srv/izao/nginx/izao-proxy.conf;
    include /srv/izao/nginx/izao-security-headers.conf;
}

location ^~ /admin/mfa/ {
    limit_req zone=izao_admin_mfa burst=3 nodelay;
    limit_req zone=izao_next_action burst=30 nodelay;
    proxy_pass http://izao_web;
    include /srv/izao/nginx/izao-proxy.conf;
    include /srv/izao/nginx/izao-security-headers.conf;
}

# Chatbot Iza: límite estricto (§20.5). Sin buffering para respuestas en streaming.
location /api/chat {
    limit_req zone=izao_chat burst=5 nodelay;
    proxy_pass http://izao_web;
    include /srv/izao/nginx/izao-proxy.conf;
    proxy_buffering off;
    proxy_read_timeout 120s;
    include /srv/izao/nginx/izao-security-headers.conf;
}

# Formularios públicos (leads, contacto, garantías).
location ~ ^/api/(leads|contact|warranty) {
    limit_req zone=izao_forms burst=5 nodelay;
    proxy_pass http://izao_web;
    include /srv/izao/nginx/izao-proxy.conf;
    include /srv/izao/nginx/izao-security-headers.conf;
}

location /api/ {
    limit_req zone=izao_next_action burst=30 nodelay;
    limit_req zone=izao_api burst=60 nodelay;
    proxy_pass http://izao_web;
    include /srv/izao/nginx/izao-proxy.conf;
    include /srv/izao/nginx/izao-security-headers.conf;
}

location / {
    limit_req zone=izao_next_action burst=30 nodelay;
    proxy_pass http://izao_web;
    include /srv/izao/nginx/izao-proxy.conf;
    include /srv/izao/nginx/izao-security-headers.conf;
}
