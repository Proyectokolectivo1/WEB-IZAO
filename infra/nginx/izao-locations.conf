# Locations comunes (producción y local). Se incluye dentro de un bloque server.
limit_req_status 429;
client_max_body_size 35m;

# Privados, nunca por /media/: fotos y video de garantías (datos personales; solo por
# /api/admin/garantias/archivo/{mediaId} con sesión), etiquetas PDF de envío (labels/) y capturas del agente
# de impresión (agent-screenshots/). ^~ gana sobre la regex de extensiones de más abajo.
location ^~ /media/warranty/ { return 404; }
location ^~ /media/labels/ { return 404; }
location ^~ /media/agent-screenshots/ { return 404; }

# Público: solo imágenes y video. root + URI = /srv/izao/media/... (la regex no admite alias).
# Cualquier otra extensión cae en `location /media/` (404). La CSP con sandbox sale del map de izao-zones.conf.
location ~* ^/media/.+\.(webp|avif|jpe?g|png|mp4)$ {
    root /srv/izao;
    # Sin "always": los 404 no llevan Cache-Control inmutable. Sin "expires": duplicaría Cache-Control.
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /srv/izao/nginx/izao-security-headers.conf;   # nosniff, HSTS y CSP default-src 'none'; sandbox
    etag on;
    if_modified_since exact;
    open_file_cache max=5000 inactive=5m;
    open_file_cache_valid 2m;
    open_file_cache_errors on;
    access_log off;
    try_files $uri =404;
}

# Estáticos de Next con hash en el nombre: caché inmutable en navegador y en Nginx.
# proxy_hide_header evita duplicar Cache-Control con el que ya envía Next.
location /_next/static/ {
    proxy_pass http://izao_web;
    include /srv/izao/nginx/izao-proxy.conf;
    proxy_cache izao_static;
    proxy_cache_valid 200 365d;
    proxy_cache_lock on;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Cache $upstream_cache_status;
    include /srv/izao/nginx/izao-security-headers.conf;
    access_log off;
}

# La tienda no usa el optimizador de imágenes de Next.
location = /_next/image { return 404; }

location /media/ { return 404; }

location = /api/health {
    proxy_pass http://izao_web;
    include /srv/izao/nginx/izao-proxy.conf;
    include /srv/izao/nginx/izao-security-headers.conf;
    access_log off;
}

# Login y MFA del panel (zonas separadas): 5 POST/min por IP en cada una con ráfaga de 3 (429 al exceder).
location = /admin/login {
    limit_req zone=izao_admin_login burst=3 nodelay;
    limit_req zone=izao_next_action burst=30 nodelay;
    proxy_pass http://izao_web;
    include /srv/izao/nginx/izao-proxy.conf;
    include /srv/izao/nginx/izao-security-headers.conf;
}

location ^~ /admin/mfa/ {
    limit_req zone=izao_admin_mfa burst=3 nodelay;
    limit_req zone=izao_next_action burst=30 nodelay;
    proxy_pass http://izao_web;
    include /srv/izao/nginx/izao-proxy.conf;
    include /srv/izao/nginx/izao-security-headers.conf;
}

# Chatbot Iza: límite estricto (§20.5). Sin buffering para respuestas en streaming.
location /api/chat {
    limit_req zone=izao_chat burst=5 nodelay;
    proxy_pass http://izao_web;
    include /srv/izao/nginx/izao-proxy.conf;
    proxy_buffering off;
    proxy_read_timeout 120s;
    include /srv/izao/nginx/izao-security-headers.conf;
}

# Formularios públicos (leads, contacto, garantías).
location ~ ^/api/(leads|contact|warranty) {
    limit_req zone=izao_forms burst=5 nodelay;
    proxy_pass http://izao_web;
    include /srv/izao/nginx/izao-proxy.conf;
    include /srv/izao/nginx/izao-security-headers.conf;
}

location /api/ {
    limit_req zone=izao_next_action burst=30 nodelay;
    limit_req zone=izao_api burst=60 nodelay;
    proxy_pass http://izao_web;
    include /srv/izao/nginx/izao-proxy.conf;
    include /srv/izao/nginx/izao-security-headers.conf;
}

location / {
    limit_req zone=izao_next_action burst=30 nodelay;
    proxy_pass http://izao_web;
    include /srv/izao/nginx/izao-proxy.conf;
    include /srv/izao/nginx/izao-security-headers.conf;
}
