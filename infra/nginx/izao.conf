# Izao Perfumería — Nginx de producción (VPS). En el VPS vive en /srv/izao/nginx/izao.conf
# junto con /srv/izao/nginx/snippets/. Si el host ya tiene proxy, se agrega este bloque
# (no se instala otro). Certificados con certbot en /etc/letsencrypt (webroot /srv/izao/certbot).
include /etc/nginx/snippets/zones.conf;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
server_tokens off;

# HTTP: reto ACME y redirección a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name izaoperfumeria.com www.izaoperfumeria.com;

    location /.well-known/acme-challenge/ {
        root /srv/izao/certbot;
    }
    location / {
        return 301 https://izaoperfumeria.com$request_uri;
    }
}

# www -> raíz (301)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.izaoperfumeria.com;

    ssl_certificate     /etc/letsencrypt/live/izaoperfumeria.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/izaoperfumeria.com/privkey.pem;

    return 301 https://izaoperfumeria.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name izaoperfumeria.com;

    ssl_certificate     /etc/letsencrypt/live/izaoperfumeria.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/izaoperfumeria.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:izao_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/snippets/locations.conf;
}
