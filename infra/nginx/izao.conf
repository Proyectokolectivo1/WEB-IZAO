# Izao Perfumería — Nginx de producción: SOLO bloques server (sirve tal cual en el Nginx del
# host o en el contenedor). En el VPS vive en /srv/izao/nginx/izao.conf y se enlaza desde
# sites-enabled. Las directivas de contexto http están en env/host/izao-http.conf (host) o
# env/container/izao-http.conf (contenedor). Certificados con certbot en /etc/letsencrypt
# (webroot /srv/izao/certbot). `listen ... ssl http2` (no `http2 on;`) para funcionar desde Nginx 1.18
# (Ubuntu 22.04) hasta 1.27; en 1.25.1+ solo emite un aviso de obsolescencia.

# HTTP: reto ACME y redirección a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name izaoperfumeria.com www.izaoperfumeria.com;
    server_tokens off;  # D-Q7: sin versión de Nginx en Server (válido en server; no choca con el http del host)

    location /.well-known/acme-challenge/ {
        root /srv/izao/certbot;
    }
    location / {
        return 301 https://izaoperfumeria.com$request_uri;
    }
}

# www -> raíz (301)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.izaoperfumeria.com;
    server_tokens off;  # D-Q7: sin versión de Nginx en Server (válido en server; no choca con el http del host)

    ssl_certificate     /etc/letsencrypt/live/izaoperfumeria.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/izaoperfumeria.com/privkey.pem;

    include /srv/izao/nginx/izao-security-headers.conf;
    return 301 https://izaoperfumeria.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name izaoperfumeria.com;
    server_tokens off;  # D-Q7: sin versión de Nginx en Server (válido en server; no choca con el http del host)

    ssl_certificate     /etc/letsencrypt/live/izaoperfumeria.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/izaoperfumeria.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:izao_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /srv/izao/nginx/izao-locations.conf;
}
